name: CI

# Docs-only changes never start CI (and need no deploy). Every other run asks
# tools/ci_scope.sh how much it needs: skip (main tree already passed as a PR),
# fast (page/coordinator only) or full (engine, kernels, core, CPU verifier).
on:
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

# Supersede stale PR runs. Never cancel a main-branch run mid-deployment.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read          # ci_scope.sh: did the merged PR's head pass CI?
  pull-requests: read

jobs:
  ci:
    name: Tests (CPU, WASM, WebGPU software)
    # Self-hosted runner: never run code from a fork's pull request on it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, b580]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Choose the test scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          # a manual run has no base: full
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash tools/ci_scope.sh >> "$GITHUB_OUTPUT"
      - name: Run CI
        if: steps.scope.outputs.scope != 'skip'
        env:
          CI_SCOPE: ${{ steps.scope.outputs.scope }}
        run: bash tools/ci_local.sh

  deploy:
    name: Deploy live website
    needs: ci
    # A manual run or PR must never deploy. Only a successful push to main does.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, b580]
    timeout-minutes: 30
    # never while server-update.yml reboots the VPS (or refresh-reference.yml deploys)
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - name: Deploy website and coordinator
        env:
          GB_DEPLOY_HOST: ${{ secrets.GB_DEPLOY_HOST }}
        run: bash server/deploy.sh
      - name: Install the native sync (goldbach-sync.timer runs this copy)
        # the runner is the B580 machine itself: the 10-minute sync follows main
        run: |
          bin_dir=$(dirname "$(bash server-rs/build.sh)")
          install -D -m 755 "$bin_dir/goldbach-sync-native" "$HOME/.local/share/goldbach-sync/goldbach-sync-native"
