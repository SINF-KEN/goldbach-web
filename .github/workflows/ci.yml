name: CI

# Docs-only changes never start CI (and need no deploy). Every other run asks
# tools/ci_scope.sh how much it needs: skip (main tree already passed as a PR),
# fast (page/coordinator only) or full (engine, kernels, core, CPU verifier).
on:
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

# Supersede stale PR runs. Never cancel a main-branch run mid-deployment.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read          # ci_scope.sh: did the merged PR's head pass CI?
  pull-requests: read

jobs:
  ci:
    name: Tests (CPU, WASM, WebGPU software)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Choose the test scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          # a manual run has no base: full
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash tools/ci_scope.sh >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-build
        if: steps.scope.outputs.scope != 'skip'
      - name: Install lavapipe (software Vulkan for the WebGPU tests)
        if: steps.scope.outputs.scope != 'skip'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers libvulkan1
          echo "GB_LAVAPIPE_ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)" >> "$GITHUB_ENV"
      - name: Run CI
        if: steps.scope.outputs.scope != 'skip'
        env:
          CI_SCOPE: ${{ steps.scope.outputs.scope }}
        run: bash tools/ci_local.sh

  deploy:
    name: Deploy live website
    needs: ci
    # A manual run or PR must never deploy. Only a successful push to main does.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # GB_DEPLOY_KEY and GB_DEPLOY_KNOWN_HOSTS live in this environment, which only main can use
    environment: production
    # never while server-update.yml reboots the VPS (or refresh-reference.yml deploys)
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    env:
      GB_DEPLOY_HOST: ${{ secrets.GB_DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v6
      - name: SSH key for the VPS
        env:
          GB_DEPLOY_KEY: ${{ secrets.GB_DEPLOY_KEY }}
          GB_DEPLOY_KNOWN_HOSTS: ${{ secrets.GB_DEPLOY_KNOWN_HOSTS }}
        run: |
          # The logs are public and the site's origin sits behind Cloudflare:
          # the secret's mask covers user@host, not the bare address ssh may print.
          echo "::add-mask::${GB_DEPLOY_HOST#*@}"
          install -d -m 700 ~/.ssh
          ( umask 077
            printf '%s\n' "$GB_DEPLOY_KEY" > ~/.ssh/id_ed25519
            printf '%s\n' "$GB_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
            printf 'LogLevel ERROR\nStrictHostKeyChecking yes\n' > ~/.ssh/config )
      - uses: ./.github/actions/setup-build
      - name: Deploy website and coordinator
        run: bash server/deploy.sh
